<div class="formulario-container">

  <div class="exito" *ngIf="enviado">
     ¡Mensaje enviado correctamente!
  </div>

  <form [formGroup]="formularioContacto" (ngSubmit)="onSubmit()">

    <!-- Nombre -->
    <div class="campo" [class.valido]="nombre?.valid && nombre?.touched" [class.invalido]="nombre?.invalid && nombre?.touched">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" formControlName="nombre" placeholder="Tu nombre">
      <span class="error" *ngIf="nombre?.invalid && nombre?.touched">
        <span *ngIf="nombre?.errors?.['required']">El nombre es obligatorio.</span>
        <span *ngIf="nombre?.errors?.['minlength']">Mínimo 3 caracteres.</span>
      </span>
    </div>

    <!-- Email -->
    <div class="campo" [class.valido]="email?.valid && email?.touched" [class.invalido]="email?.invalid && email?.touched">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="tu@email.com">
      <span class="error" *ngIf="email?.invalid && email?.touched">
        <span *ngIf="email?.errors?.['required']">El email es obligatorio.</span>
        <span *ngIf="email?.errors?.['email']">Introduce un email válido.</span>
      </span>
    </div>

    <!-- Mensaje -->
    <div class="campo" [class.valido]="mensaje?.valid && mensaje?.touched" [class.invalido]="mensaje?.invalid && mensaje?.touched">
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" formControlName="mensaje" placeholder="Escribe tu mensaje..." rows="5"></textarea>
      <span class="error" *ngIf="mensaje?.invalid && mensaje?.touched">
        <span *ngIf="mensaje?.errors?.['required']">El mensaje es obligatorio.</span>
        <span *ngIf="mensaje?.errors?.['minlength']">Mínimo 10 caracteres.</span>
      </span>
    </div>

    <button type="submit">Enviar mensaje</button>

  </form>
</div>
