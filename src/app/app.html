<!-- Navegación principal de la SPA -->
<nav aria-label="Navegación principal">
  <ul>
    <li><a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}">Inicio</a></li>
    <li><a routerLink="/servicios" routerLinkActive="activo">Servicios</a></li>
    <li><a routerLink="/contacto" routerLinkActive="activo">Contacto</a></li>
  </ul>
  <button class="btn-tema" (click)="toggleModo()">
    {{ modoOscuro ? 'Modo Claro' : 'Modo Oscuro' }}
  </button>
</nav>

<!-- Contenedor donde Angular renderiza el componente de cada ruta -->
<main>
  <router-outlet></router-outlet>
</main>
